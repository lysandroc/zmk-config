include:
  - board: nice_nano_v2
    shield: corne_left
    # enable zmk studio
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=n
    config: corne_left.conf

  - board: nice_nano_v2
    shield: corne_right
    config: corne_right.conf
  
  - board: nice_nano_v2
    shield: settings_reset
  
